services:
  app:
    build:
      context: ../../..
      dockerfile: di/examples/04-fastify-cats-complete/Dockerfile
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://cats:cats@postgres:5432/cats
      REDIS_URL: redis://redis:6379
      GCS_ENDPOINT: http://gcs:4443
      GCS_BUCKET: cats
      GCS_PROJECT_ID: cats-local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gcs:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: cats
      POSTGRES_PASSWORD: cats
      POSTGRES_DB: cats
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cats']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  gcs:
    image: fsouza/fake-gcs-server:1.52@sha256:666f86b873120818b10a5e68d99401422fcf8b00c1f27fe89599c35236f48b4c
    ports:
      - '4443:4443'
    command:
      - -scheme=http
      - -public-host=localhost:4443
    volumes:
      - ./_tests/_testdata/gcs/data:/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:4443/storage/v1/b/cats/o']
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
