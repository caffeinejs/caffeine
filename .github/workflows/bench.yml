name: Bench
run-name: 'Bench :: ${{ inputs.benchmark }}'

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: 'Benchmark to run'
        required: true
        type: choice
        options:
          - aspect
          - config-read
          - config-reload
          - di
          - di-compare
          - di-compile
          - di-perf
          - fastify
          - helloworld
          - memory
          - mixedscopes
          - authn
          - startup
          - request
          - request:bun
          - resilience
          - testing

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: 'Bench :: ${{ inputs.benchmark }}'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: |
          npm run build
          npm run build -w @caffeinejs/benchmarks

      - name: Fixture tests
        run: npm run test:fixtures -w @caffeinejs/benchmarks

      - name: Benchmark
        # An explicit shell turns on pipefail: without it tee's exit code hides a benchmark that failed.
        shell: bash
        run: npm run bench:${{ inputs.benchmark }} -w @caffeinejs/benchmarks | tee /tmp/bench-output.txt

      - name: Summary
        if: always()
        run: |
          echo "## Benchmark: \`${{ inputs.benchmark }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Shared runner: compare rows within this run, not numbers across runs." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat /tmp/bench-output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
