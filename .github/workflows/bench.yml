name: Bench
run-name: 'Bench :: ${{ inputs.benchmark }}'

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: 'Benchmark to run'
        required: true
        type: choice
        options:
          - aspect
          - config-read
          - config-reload
          - di
          - di-compare
          - di-compile
          - di-perf
          - fastify
          - helloworld
          - memory
          - mixedscopes
          - authn
          - caching
          - startup
          - request
          - request:bun
          - resilience
          - testing

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: 'Bench :: ${{ inputs.benchmark }}'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: |
          npm run build
          npm run build -w @caffeinejs/benchmarks

      - name: Fixture tests
        run: npm run test:fixtures -w @caffeinejs/benchmarks

      - name: Benchmark
        # An explicit shell turns on pipefail: without it tee's exit code hides a benchmark that failed.
        shell: bash
        # The load benchmarks size their window off the cores available; pinning it keeps two runs comparable
        # when GitHub changes the runner. The timeout is generous because the runner is shared.
        env:
          BENCH_CONNECTIONS: '32'
          BENCH_PIPELINING: '8'
          BENCH_TIMEOUT: '30'
        run: npm run bench:${{ inputs.benchmark }} -w @caffeinejs/benchmarks | tee /tmp/bench-output.txt

      - name: Summary
        if: always()
        run: |
          echo "## Benchmark: \`${{ inputs.benchmark }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Shared runner: compare rows within this run, not numbers across runs." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat /tmp/bench-output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
