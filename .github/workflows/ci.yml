name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '[0-9]+.x'
    tags:
      - '*'
    paths-ignore:
      - '.vscode/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - '.vscode/**'
      - 'docs/**'
      - '**.md'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 'Test :: ${{ matrix.node-version }}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        node-version: ['24']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: |
          npm run build:cli

          npm run build
          npm run build --workspaces --if-present

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run test:typecheck

      - name: CLI Tests
        run: npm test -w @caffeinejs/cli

      - name: Memory Leak Test
        run: npm run test:memory

      - name: Test & Coverage
        run: npm run test:coverage

      - name: Coverage Summary
        run: node tools/coverage-summary.mjs

      - name: Upload Coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/lcov.info
          fail_ci_if_error: false

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          report_type: test_results
          files: coverage/junit.xml
          fail_ci_if_error: false

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # A service that is down fails its spec instead of skipping it.
      CAFFEINE_E2E_STRICT: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Services
        run: |
          docker compose -f test/services/configserver/docker-compose.yml up --build --wait --wait-timeout 300
          docker compose -f test/services/oauthserver/docker-compose.yml up --build --wait --wait-timeout 300
          docker compose -f test/services/redis/docker-compose.yml up --wait --wait-timeout 120

      - name: E2E
        run: npm run test:e2e

      - name: Service Logs
        if: ${{ failure() }}
        run: |
          docker compose -f test/services/configserver/docker-compose.yml logs
          docker compose -f test/services/oauthserver/docker-compose.yml logs
          docker compose -f test/services/redis/docker-compose.yml logs
