name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '[0-9]+.x'
    tags:
      - '*'
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6.0.2

      - name: node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: install
        run: npm ci --ignore-scripts

      - name: format check
        run: npm run fmt:check

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build

  test:
    name: test on ${{ matrix.os }} @ ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    needs: build

    permissions:
      contents: read

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        node-version: ['22', '24']

    steps:
      - name: checkout
        uses: actions/checkout@v6.0.2

      - name: node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: install
        run: npm ci --ignore-scripts

      - name: test
        run: npm test
