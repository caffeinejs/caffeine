name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '[0-9]+.x'
    tags:
      - '*'
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: |
          npm run test:typecheck
          npm run test:typecheck:legacy

      - name: Memory Leak Test
        run: npm run test:memory

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            core/dist/
            http/dist/
            http-fastify-adapter/dist/
          retention-days: 1

  test:
    name: 'Test :: ${{ matrix.node-version }}'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: ['24', '26']

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Download Build
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: .

      - name: Install
        run: npm ci --ignore-scripts

      - name: Test CJS
        run: npm run test:cjs

      - name: Test
        run: npm run test:coverage
