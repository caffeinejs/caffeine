name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '[0-9]+.x'
    tags:
      - '*'
    paths-ignore:
      - '.vscode/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - '.vscode/**'
      - 'docs/**'
      - '**.md'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 'Test :: ${{ matrix.node-version }}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        node-version: ['24']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: |
          npm run build:cli

          npm run build
          npm run build --workspaces --if-present

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run test:typecheck

      - name: CLI Tests
        run: npm test -w @caffeinejs/cli

      - name: Memory Leak Test
        run: npm run test:memory

      - name: Test & Coverage
        run: npm run test:coverage

      - name: Coverage Summary
        run: node tools/coverage-summary.mjs

      - name: Upload Coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/lcov.info
          fail_ci_if_error: false

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          report_type: test_results
          files: coverage/junit.xml
          fail_ci_if_error: false

      # Handed to the `sonar` job below, so the analysis reports the coverage this job already computed
      # instead of running the suite a second time.
      - name: Share coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 1
          if-no-files-found: error

  sonar:
    name: Scan
    runs-on: ubuntu-latest
    needs: test
    if: ${{ !cancelled() }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # A service that is down fails its spec instead of skipping it.
      CAFFEINE_E2E_STRICT: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # `mode=max` keeps the Maven dependency stage. Separate scopes: one shared scope is overwritten by the last target.
      - name: Build service images
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        env:
          # The docker exporter used by `load` rejects the provenance attestation Buildx turns on in GitHub Actions.
          BUILDX_NO_DEFAULT_ATTESTATIONS: '1'
        with:
          # Build from the checkout rather than the Git context the action defaults to. Unlike `docker compose`, Bake
          # resolves a compose file's `build: .` from where it runs, so each target below names its own directory.
          source: .
          files: |
            test/services/configserver/docker-compose.yml
            test/services/oauthserver/docker-compose.yml
          load: true
          set: |
            configserver.context=test/services/configserver
            oauthserver.context=test/services/oauthserver
            configserver.cache-from=type=gha,scope=e2e-configserver
            configserver.cache-to=type=gha,mode=max,scope=e2e-configserver,ignore-error=true
            oauthserver.cache-from=type=gha,scope=e2e-oauthserver
            oauthserver.cache-to=type=gha,mode=max,scope=e2e-oauthserver,ignore-error=true

      # `--no-build` fails if Bake did not load the tag, instead of rebuilding on the default driver.
      # A bare `wait` returns 0 when a child fails, and this shell has `-e`.
      - name: Services
        run: |
          docker compose -f test/services/configserver/docker-compose.yml up --wait --wait-timeout 300 --no-build &
          config_pid=$!
          docker compose -f test/services/oauthserver/docker-compose.yml up --wait --wait-timeout 300 --no-build &
          oauth_pid=$!
          docker compose -f test/services/redis/docker-compose.yml up --wait --wait-timeout 120 &
          redis_pid=$!
          status=0
          wait "$config_pid" || status=$?
          wait "$oauth_pid" || status=$?
          wait "$redis_pid" || status=$?
          exit "$status"

      - name: E2E
        run: npm run test:e2e

      - name: Service Logs
        if: ${{ failure() }}
        run: |
          docker compose -f test/services/configserver/docker-compose.yml logs
          docker compose -f test/services/oauthserver/docker-compose.yml logs
          docker compose -f test/services/redis/docker-compose.yml logs
