name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '[0-9]+.x'
    tags:
      - '*'
    paths-ignore:
      - '.vscode/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - '.vscode/**'
      - 'docs/**'
      - '**.md'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 'Test :: ${{ matrix.node-version }}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      # Each Node version reports its own result, rather than a failure on one cancelling the other.
      fail-fast: false
      matrix:
        # 24 also runs what does not depend on the Node version: lint, type-check, the CLI's Bun tests, and the
        # coverage reports, whose artifact can be uploaded only once.
        include:
          - node-version: '22'
          - node-version: '24'
            primary: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: |
          npm run build:cli

          npm run build
          npm run build --workspaces --if-present

      - name: Lint
        if: ${{ matrix.primary }}
        run: npm run lint

      - name: Type Check
        if: ${{ matrix.primary }}
        run: npm run test:typecheck

      - name: CLI Tests
        if: ${{ matrix.primary }}
        run: npm test -w @caffeinejs/cli

      - name: Memory Leak Test
        run: npm run test:memory

      - name: Test & Coverage
        run: npm run test:coverage

      - name: Coverage Summary
        if: ${{ matrix.primary }}
        run: node tools/coverage-summary.mjs

      - name: Upload Coverage
        if: ${{ !cancelled() && matrix.primary }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/lcov.info
          fail_ci_if_error: false

      - name: Upload test results
        if: ${{ !cancelled() && matrix.primary }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          report_type: test_results
          files: coverage/junit.xml
          fail_ci_if_error: false

      # Handed to the `sonar` job below, so the analysis reports the coverage this job already computed
      # instead of running the suite a second time.
      - name: Share coverage
        if: ${{ !cancelled() && matrix.primary }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 1
          if-no-files-found: error

  sonar:
    name: Scan
    runs-on: ubuntu-latest
    needs: test
    if: ${{ !cancelled() }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage

      - name: SonarQube Scan
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # A service that is down fails its spec instead of skipping it.
      CAFFEINE_E2E_STRICT: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # `mode=max` keeps the Maven dependency stage. Separate scopes: one shared scope is overwritten by the last target.
      - name: Build service images
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        env:
          # The docker exporter used by `load` rejects the provenance attestation Buildx turns on in GitHub Actions.
          BUILDX_NO_DEFAULT_ATTESTATIONS: '1'
        with:
          # Build from the checkout rather than the Git context the action defaults to. Unlike `docker compose`, Bake
          # resolves a compose file's `build: .` from where it runs, so each target below names its own directory.
          source: .
          files: |
            test/services/configserver/docker-compose.yml
            test/services/oauthserver/docker-compose.yml
          load: true
          set: |
            configserver.context=test/services/configserver
            oauthserver.context=test/services/oauthserver
            configserver.cache-from=type=gha,scope=e2e-configserver
            configserver.cache-to=type=gha,mode=max,scope=e2e-configserver,ignore-error=true
            oauthserver.cache-from=type=gha,scope=e2e-oauthserver
            oauthserver.cache-to=type=gha,mode=max,scope=e2e-oauthserver,ignore-error=true

      # `--no-build` fails if Bake did not load the tag, instead of rebuilding on the default driver.
      # A bare `wait` returns 0 when a child fails, and this shell has `-e`.
      - name: Services
        run: |
          docker compose -f test/services/configserver/docker-compose.yml up --wait --wait-timeout 300 --no-build &
          config_pid=$!
          docker compose -f test/services/oauthserver/docker-compose.yml up --wait --wait-timeout 300 --no-build &
          oauth_pid=$!
          docker compose -f test/services/redis/docker-compose.yml up --wait --wait-timeout 120 &
          redis_pid=$!
          status=0
          wait "$config_pid" || status=$?
          wait "$oauth_pid" || status=$?
          wait "$redis_pid" || status=$?
          exit "$status"

      - name: E2E
        run: npm run test:e2e

      - name: Service Logs
        if: ${{ failure() }}
        run: |
          docker compose -f test/services/configserver/docker-compose.yml logs
          docker compose -f test/services/oauthserver/docker-compose.yml logs
          docker compose -f test/services/redis/docker-compose.yml logs

  devtools-ui-image:
    name: DevTools UI Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 -f devtools-ui/Dockerfile .
          docker buildx build --load -t devtools-ui:ci -f devtools-ui/Dockerfile .

      - name: Smoke test
        run: |
          docker run -d --name devtools-ui --read-only --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:9091:9091 devtools-ui:ci
          for _ in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' devtools-ui)" = healthy ] && break
            sleep 2
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' devtools-ui)" = healthy ]
          [ "$(docker inspect -f '{{.Config.User}}' devtools-ui)" = nonroot ]
          curl -fsS http://127.0.0.1:9091/readyz
          curl -fsS -o /dev/null http://127.0.0.1:9091/static/site.css
          [ "$(curl -s -o page.html -w '%{http_code}' http://127.0.0.1:9091/)" = 502 ]
          grep -q 'Cannot reach the devtools at http://127.0.0.1:9090/devtools' page.html
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:9091/)" = 421 ]
          docker stop devtools-ui
          [ "$(docker inspect -f '{{.State.ExitCode}}' devtools-ui)" = 0 ]

      - name: Logs
        if: ${{ failure() }}
        run: docker logs devtools-ui
