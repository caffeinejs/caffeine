name: Package

# Packs what a release publishes, with an SBOM of each platform's binary, and installs it the way an application does,
# on every platform the caffeine binary is built for. CI runs it on every change; the release runs it to build what it
# publishes.
on:
  workflow_call:
    inputs:
      retention-days:
        description: Days the packed tarballs are kept
        type: number
        default: 1

permissions:
  contents: read

jobs:
  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # No Bun: release:pack compiles with the Bun runtimes tools/bun-runtimes.json pins.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Pack
        run: npm run release:pack

      - name: Check
        run: npm run packages:check -- --tarballs artifacts

      # A package with no `exports`, an application or a platform's binary, has nothing to import and no types.
      - name: Lint
        run: |
          for tarball in artifacts/*.tgz; do
            ./node_modules/.bin/publint --strict "$tarball"
            if tar -xzOf "$tarball" package/package.json | jq -e '.exports' > /dev/null; then
              ./node_modules/.bin/attw "$tarball" --profile esm-only
            fi
          done

      # What the release runs to publish, with every publish rehearsed: the order, the dist-tag and each tarball.
      - name: Rehearse publish
        run: node tools/publish.mjs artifacts --dry-run

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            artifacts/*.tgz
            artifacts/packages.json
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

      # Apart from the tarballs, so the release attaches them without downloading every binary.
      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sboms
          path: artifacts/*.cdx.json
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  install:
    name: 'Install :: ${{ matrix.os }} :: Node ${{ matrix.node-version }} :: ${{ matrix.pm }}'
    runs-on: ${{ matrix.os }}
    needs: pack
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node-version: '24', pm: npm }
          - { os: ubuntu-latest, node-version: '26', pm: npm }
          # pnpm installs no package another one does not declare, so it finds a dependency a package forgot.
          - { os: ubuntu-latest, node-version: '24', pm: pnpm }
          - { os: ubuntu-24.04-arm, node-version: '24', pm: npm }
          - { os: macos-latest, node-version: '24', pm: npm }
          - { os: windows-latest, node-version: '24', pm: npm }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: pnpm
        if: ${{ matrix.pm == 'pnpm' }}
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0

      - name: Packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts

      - name: Test
        run: node test/package/run.mjs artifacts --pm ${{ matrix.pm }}

  install-musl:
    name: 'Install :: alpine :: Node 24 :: npm'
    runs-on: ubuntu-latest
    needs: pack
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts

      - name: Test
        run: docker compose -f test/package/docker-compose.yml run --rm musl
