name: Docs - Lint

on:
  push:
    paths:
      - '**/*.md'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.md'

permissions:
  contents: read

jobs:
  build:
    name: Lint Markdown
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 'lts/*'
          check-latest: true

      - name: Install Linter
        run: npm ci --ignore-scripts || (rm -rf node_modules ~/.npm && npm ci --ignore-scripts)

      - name: Matcher
        uses: xt0rted/markdownlint-problem-matcher@1a5fabfb577370cfdf5af944d418e4be3ea06f27

      - name: Linter
        run: ./node_modules/.bin/markdownlint-cli2
