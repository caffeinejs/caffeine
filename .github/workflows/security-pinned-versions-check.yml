name: Security - Pinned Versions Check

on:
  push:
    branches:
      - main
      - '[0-9]+.x'
  pull_request:

concurrency:
  group: pins-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pinned-versions:
    name: Pinned Versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Pins
        run: node tools/check-pins.mjs
