version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore'
    open-pull-requests-limit: 2
    target-branch: main

  - package-ecosystem: 'docker'
    directories:
      - '/di/_tests/deno'
      - '/di/examples/04-fastify-cats-complete'
      - '/examples/03-petstore'
      - '/examples/04-spa-dashboard'
      - '/test/services/configserver'
      - '/test/services/oauthserver'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore'
    open-pull-requests-limit: 2
    target-branch: main
    groups:
      docker:
        patterns:
          - '*'

  - package-ecosystem: 'docker-compose'
    directories:
      - '/examples/03-petstore'
      - '/examples/04-spa-dashboard'
      - '/kafka'
      - '/test/services/configserver'
      - '/test/services/oauthserver'
      - '/test/services/redis'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore'
    open-pull-requests-limit: 2
    target-branch: main
    groups:
      docker-compose:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore'
    open-pull-requests-limit: 5
    target-branch: main
    versioning-strategy: increase
    exclude-paths:
      - 'di/_tests/deno/**'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    allow:
      - dependency-type: all
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      test:
        patterns:
          - 'vitest*'
          - '@vitest/*'
          - 'oxlint*'
          - 'oxfmt*'
          - 'fast-check'
          - '@fast-check/*'
          - 'markdownlint-cli2'
          - '@swc/*'
          - 'unplugin-swc'
          - 'esbuild'
          - 'supertest'
          - '@types/supertest'
          - 'globby'
          - 'eslint'
      typescript:
        patterns:
          - 'typescript'
          - 'tsx'
          - 'typescript-eslint'
          - '@types/node'
          - '@types/bun'
      dependencies:
        patterns:
          - '*'
        exclude-patterns:
          - '@caffeinejs/*'
