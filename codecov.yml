codecov:
  require_ci_to_pass: false

ignore:
  - 'api/**'
  - '**/_tests/**'
  - '**/_testdata/**'
  - '**/*.testkit.ts'
  - '**/*.gen.ts'
  - 'benchmarks/**'
  - 'docs/**'
  - 'examples/**'
  - 'multipart/**'
  - 'parked/**'
  - 'plugins/**'
  - 'test/**'
  - 'tools/**'
  - 'view/**'

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
