services:
  redis:
    image: redis:8-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
  valkey:
    image: valkey/valkey:9-alpine
    ports:
      - '127.0.0.1:6380:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
  # One-node clusters. A single node owns every slot, and still answers CROSSSLOT to a command whose keys fall in
  # two of them, which is what a cluster-aware client of these has to be tested against. The node announces the
  # address the host reaches it on, since a cluster client dials what the node announces.
  redis-cluster:
    image: redis:8-alpine
    command: >
      sh -c "redis-server --port 6381 --cluster-enabled yes --cluster-announce-ip 127.0.0.1
      --cluster-announce-port 6381 --save '' --appendonly no &
      until redis-cli -p 6381 ping; do sleep 0.2; done;
      redis-cli -p 6381 cluster addslotsrange 0 16383;
      wait"
    ports:
      - '127.0.0.1:6381:6381'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -p 6381 cluster info | grep -q cluster_state:ok']
      interval: 5s
      timeout: 3s
      retries: 10
  valkey-cluster:
    image: valkey/valkey:9-alpine
    command: >
      sh -c "valkey-server --port 6382 --cluster-enabled yes --cluster-announce-ip 127.0.0.1
      --cluster-announce-port 6382 --save '' --appendonly no &
      until valkey-cli -p 6382 ping; do sleep 0.2; done;
      valkey-cli -p 6382 cluster addslotsrange 0 16383;
      wait"
    ports:
      - '127.0.0.1:6382:6382'
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli -p 6382 cluster info | grep -q cluster_state:ok']
      interval: 5s
      timeout: 3s
      retries: 10
