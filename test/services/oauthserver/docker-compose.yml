services:
  oauthserver:
    image: caffeine-e2e-oauthserver:local
    build: .
    ports:
      - '9000:9000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9000/actuator/health']
      interval: 10s
      timeout: 5s
      retries: 5
      # The JVM takes its time on a cold runner; a failed probe in here does not count against the retries.
      start_period: 60s
