<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Caffeine SPA Dashboard</title>
    <meta name="description" content="A single-page application and its API, served by Caffeine." />

    <!-- Root-level files a real site ships. Each is its own route under `wildcard: false`, which is why the
         mount is declared `{ anonymous: true }` — otherwise every one of them would need listing in the
         authentication gate's `except`. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- build.mjs substitutes the content-hashed names esbuild emitted. -->
    <link rel="stylesheet" href="%CSS%" />
    <script type="module" src="%JS%"></script>
  </head>
  <body>
    <div id="root">
      <noscript>This application needs JavaScript. The API at <code>/api</code> does not.</noscript>
    </div>
  </body>
</html>
