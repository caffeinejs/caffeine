services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: petstore
      POSTGRES_PASSWORD: petstore
      POSTGRES_DB: petstore
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petstore -d petstore"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - petstore-pgdata:/var/lib/postgresql/data

  petstore:
    build:
      context: ../..
      dockerfile: examples/03-petstore/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://petstore:petstore@postgres:5432/petstore?schema=public
      PETSTORE_JWT_SECRET: petstore-dev-secret
      PETSTORE_SERVER__PORT: 3000
    ports:
      - "3000:3000"

volumes:
  petstore-pgdata:
