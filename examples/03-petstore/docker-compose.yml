services:
  postgres:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: petstore
      POSTGRES_PASSWORD: petstore
      POSTGRES_DB: petstore
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U petstore -d petstore']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - petstore-pgdata:/var/lib/postgresql

  petstore:
    # Docker's built-in init (tini) becomes PID 1: it forwards SIGTERM to the entrypoint and reaps zombies. Without
    # it node runs as PID 1, where the default signal dispositions do not apply and nothing reaps orphans.
    init: true
    build:
      context: ../..
      dockerfile: examples/03-petstore/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://petstore:petstore@postgres:5432/petstore?schema=public
      # Layers config/application-docker.yaml over config/application.yaml.
      CAFFEINE_PROFILES: docker
    ports:
      - '3000:3000'

volumes:
  petstore-pgdata:
