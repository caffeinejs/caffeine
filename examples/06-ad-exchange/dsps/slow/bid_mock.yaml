# yaml-language-server: $schema=https://vlatte.dev/schemas/http.schema.json
# dsp-slow. Bids every auction, and high, but on a long tail: half its answers take more than 70ms and some take
# seconds. Those miss the 80ms deadline and count as slow calls; the auction goes on without them.
id: bid
request:
  method: POST
  path: /bid
delay:
  type: lognormal
  median: 70ms
  sigma: 0.8
  maxValue: 3s
response:
  status: 200
  header:
    content-type: application/json
  body: >-
    {"id": {{ (fromJSON .Request.Body.String).id | toJSON }},
    "price": {{ printf "%.2f" (randomFloat 1.5 3.5) }},
    "adm": "<img src=\"https://slow.ads.test/creative.png\">"}
  template:
    enabled: true
---
# The win notice: the exchange tells the winner what it pays.
id: win
request:
  method: POST
  path: /win
response:
  status: 200
