# yaml-language-server: $schema=https://vlatte.dev/schemas/http.schema.json
# dsp-echo. The fastest, and the one that agreed to 500 bid requests a second: bids 9 auctions of 10, low.
id: bid
request:
  method: POST
  path: /bid
delay:
  type: lognormal
  median: 10ms
  sigma: 0.25
  maxValue: 40ms
response_random:
  responses:
    - &bid
      status: 200
      header:
        content-type: application/json
      body: >-
        {"id": {{ (fromJSON .Request.Body.String).id | toJSON }},
        "price": {{ printf "%.2f" (randomFloat 0.5 2.0) }},
        "adm": "<img src=\"https://echo.ads.test/creative.png\">"}
      template:
        enabled: true
    - *bid
    - *bid
    - *bid
    - *bid
    - *bid
    - *bid
    - *bid
    - *bid
    - &pass
      status: 204
---
# The win notice: the exchange tells the winner what it pays.
id: win
request:
  method: POST
  path: /win
response:
  status: 200
