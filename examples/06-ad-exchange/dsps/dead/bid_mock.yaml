# yaml-language-server: $schema=https://vlatte.dev/schemas/http.schema.json
# dsp-dead. Accepts the connection, reads the request, and never answers: the exchange's deadline is all that ends
# the wait, until its circuit breaker opens and the exchange stops calling it.
id: bid
priority: 10
request:
  method: POST
  path: /bid
response:
  status: 200
wire_pipes:
  - type: timeout
---
# Off at start. Turn it on to bring the DSP back while the load runs, and watch its breaker close again:
#   curl -X PATCH localhost:8206/mocks/alive -H 'content-type: application/json' -d '{"enabled": true}'
id: alive
enabled: false
request:
  method: POST
  path: /bid
delay:
  type: lognormal
  median: 20ms
  sigma: 0.3
  maxValue: 60ms
response:
  status: 200
  header:
    content-type: application/json
  body: >-
    {"id": {{ (fromJSON .Request.Body.String).id | toJSON }},
    "price": {{ printf "%.2f" (randomFloat 0.5 2.5) }},
    "adm": "<img src=\"https://dead.ads.test/creative.png\">"}
  template:
    enabled: true
---
# The win notice: the exchange tells the winner what it pays.
id: win
request:
  method: POST
  path: /win
response:
  status: 200
