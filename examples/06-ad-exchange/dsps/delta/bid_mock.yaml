# yaml-language-server: $schema=https://vlatte.dev/schemas/http.schema.json
# dsp-delta. Jittery but inside the deadline: 20ms to 40ms, bids every other auction, and high.
id: bid
request:
  method: POST
  path: /bid
delay:
  type: jitter
  latency: 30ms
  jitter: 10ms
response_random:
  responses:
    - &bid
      status: 200
      header:
        content-type: application/json
      body: >-
        {"id": {{ (fromJSON .Request.Body.String).id | toJSON }},
        "price": {{ printf "%.2f" (randomFloat 1.0 3.0) }},
        "adm": "<img src=\"https://delta.ads.test/creative.png\">"}
      template:
        enabled: true
    - &pass
      status: 204
---
# The win notice: the exchange tells the winner what it pays.
id: win
request:
  method: POST
  path: /win
response:
  status: 200
