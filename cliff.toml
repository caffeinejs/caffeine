# The notes of a GitHub release, from the pull request titles merged since the previous release tag. They print to
# stdout; no file in the repository holds them.
#
#   npx git-cliff --current      the release tagged at HEAD
#   npx git-cliff --unreleased   what the next release would hold
#
# A breaking change, a type with `!`, is listed first whatever its type. Other than that, only the types a user of
# the packages acts on are listed.

[changelog]
body = """
{% set breaking = commits | filter(attribute="breaking", value=true) -%}
{% if breaking | length > 0 -%}
### Breaking changes

{% for commit in breaking -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endif -%}
{% for entry in commits | filter(attribute="breaking", value=false) | commit_groups(groups=commit_parsers_groups) -%}
### {{ entry.group }}

{% for commit in entry.commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endfor -%}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
tag_pattern = "^v[0-9]"
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^docs", group = "Documentation" },
  { message = ".*", skip = true },
]
